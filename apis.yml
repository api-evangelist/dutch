aid: dutch
name: Dutch
description: >-
  Dutch (dutch.com) is a United States pet telemedicine service that gives dog
  and cat owners 24/7 access to licensed online veterinarians through a
  low-cost membership (from about $11/month), pairing virtual vet visits with
  free prescription delivery to most states. Founded to bring the
  direct-to-consumer telehealth model to pet care, Dutch is backed by Forerunner
  Ventures. The public presence is a consumer telehealth storefront hosted on
  Shopify; at the time of profiling no first-party public developer API,
  OpenAPI, or SDK surface was found. This API Evangelist profile captures the
  company's real, published web surface (identity, policies, account, support)
  and the live platform-level discovery documents exposed on the domain.
